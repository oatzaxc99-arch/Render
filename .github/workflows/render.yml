name: Render video
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write project files
        run: |
          mkdir -p scripts build out
          cat > package.json <<'EOF_FILE'
          { "name": "whatif-video", "private": true, "type": "module", "dependencies": { "playwright": "1.49.1" } }
          EOF_FILE
          cat > script.json <<'EOF_FILE'
          {
            "voice": "khanomkrok",
            "model": "paxa-tts-flash-v2",
            "direction": "[warm, unhurried]",
            "targetSeconds": 34,
            "scenes": [
              "ทุกคนกำลังตื่นเต้นกับ AI แต่มีเรื่องหนึ่ง ที่เกือบทุกคนลืมไป ชิปอาจขาดตลาด",
              "AI ใช้ชิปมหาศาล โดยเฉพาะหน่วยความจำ ศูนย์ข้อมูลทุกแห่ง แย่งกันซื้อ",
              "แต่โรงงานผลิตชิป ขยายกำลังผลิตไม่ทัน กว่าจะสร้างเสร็จ ใช้เวลาเป็นปี",
              "ผลคือ แรม โทรศัพท์ และคอมพิวเตอร์ ราคาอาจแพงขึ้น บางรุ่นอาจหาซื้อยาก",
              "ผู้ผลิตบางราย เตือนว่า ปัญหานี้ อาจลากยาวไปถึงปีหน้า",
              "แล้วคุณล่ะ คิดว่าชิปจะขาดไปอีกนานแค่ไหน? เขียนความเห็นไว้ในคอมเมนต์ แล้วกดติดตามไว้ ตอนหน้าห้ามพลาด"
            ]
          }
          EOF_FILE
          cat > scripts/tts.mjs <<'EOF_FILE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const KEY = process.env.PAXA_API_KEY;
          if (!KEY) { console.error('Missing PAXA_API_KEY secret'); process.exit(1); }
          const cfg = JSON.parse(fs.readFileSync('script.json', 'utf8'));
          fs.mkdirSync('build/raw', { recursive: true });

          const probe = f => parseFloat(execFileSync('ffprobe', ['-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', f]).toString());

          async function synth(text, file) {
            if (fs.existsSync(file)) return;
            const attempts = [`${cfg.direction} ${text}`, text];
            for (let i = 0; i < attempts.length; i++) {
              const r = await fetch('https://api.paxalabs.com/v1/tts', {
                method: 'POST',
                headers: { Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: attempts[i], voice: cfg.voice, model: cfg.model })
              });
              if (r.ok) { fs.writeFileSync(file, Buffer.from(await r.arrayBuffer())); return; }
              const body = await r.text();
              console.error(`TTS ${r.status}: ${body}`);
              if (i === attempts.length - 1) throw new Error('TTS failed');
              console.error('Retrying without direction tag...');
            }
          }

          const raws = [];
          for (let i = 0; i < cfg.scenes.length; i++) {
            const hash = crypto.createHash('md5').update(cfg.voice + cfg.direction + cfg.scenes[i]).digest('hex').slice(0, 8);
            const f = `build/raw/${i}-${hash}.mp3`;
            await synth(cfg.scenes[i], f);
            raws.push({ f, a: probe(f) });
          }

          const PAD = 0.25, LASTPAD = 0.7;
          const pads = PAD * (raws.length - 1) + LASTPAD;
          const sumA = raws.reduce((s, r) => s + r.a, 0);
          let tempo = sumA / (cfg.targetSeconds - pads);
          tempo = Math.min(1.25, Math.max(0.85, tempo));
          console.log(`Raw speech ${sumA.toFixed(2)}s, tempo x${tempo.toFixed(3)}`);

          let t = 0;
          const scenes = [];
          const list = [];
          raws.forEach((r, i) => {
            const speech = r.a / tempo;
            const dur = speech + (i === raws.length - 1 ? LASTPAD : PAD);
            const out = `build/scene_${i}.wav`;
            execFileSync('ffmpeg', ['-y', '-i', r.f, '-af', `atempo=${tempo},apad=whole_dur=${dur}`, '-t', String(dur), '-ar', '44100', '-ac', '1', out], { stdio: 'ignore' });
            scenes.push({ text: cfg.scenes[i], start: t, dur, speech });
            list.push(`file 'scene_${i}.wav'`);
            t += dur;
          });
          fs.writeFileSync('build/list.txt', list.join('\n'));
          execFileSync('ffmpeg', ['-y', '-f', 'concat', '-safe', '0', '-i', 'build/list.txt', '-c', 'copy', 'build/audio.wav'], { stdio: 'ignore' });
          fs.writeFileSync('build/timeline.json', JSON.stringify({ scenes, total: t }, null, 1));
          console.log(`Total ${t.toFixed(2)}s (target ${cfg.targetSeconds}s)`);
          EOF_FILE
          cat > scripts/render.mjs <<'EOF_FILE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          const FPS = 30;
          const tl = JSON.parse(fs.readFileSync('build/timeline.json', 'utf8'));
          fs.rmSync('build/frames', { recursive: true, force: true });
          fs.mkdirSync('build/frames', { recursive: true });
          fs.mkdirSync('out', { recursive: true });

          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1080, height: 1920 }, deviceScaleFactor: 1 });
          page.on('pageerror', e => { console.error('PAGE ERROR', e); process.exit(1); });
          await page.goto('file://' + path.resolve('index.html'));
          await page.evaluate(() => document.fonts.ready);
          await page.evaluate(t => window.setTimeline(t), tl);

          const n = Math.round(tl.total * FPS);
          for (let i = 0; i < n; i++) {
            await page.evaluate(t => window.seek(t), i / FPS);
            await page.screenshot({ path: `build/frames/${String(i).padStart(5, '0')}.png` });
            if (i % 150 === 0) console.log(`frame ${i}/${n}`);
          }
          await browser.close();

          execFileSync('ffmpeg', ['-y', '-framerate', String(FPS), '-i', 'build/frames/%05d.png', '-i', 'build/audio.wav',
            '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-crf', '17', '-preset', 'medium',
            '-c:a', 'aac', '-b:a', '192k', '-t', String(tl.total), '-movflags', '+faststart', 'out/video.mp4'], { stdio: 'inherit' });
          EOF_FILE
          cat > index.html <<'EOF_FILE'
          <!doctype html>
          <html lang="th"><head><meta charset="utf-8">
          <style>
          :root{--ink:#070d1f;--ink2:#12275a;--acc:#38d6ff;--warn:#ffb020;--red:#ff4d5e;--paper:#f2f6ff}
          *{box-sizing:border-box;margin:0;padding:0}
          html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
          #stage{position:relative;width:1080px;height:1920px;overflow:hidden;color:#fff;
           background:radial-gradient(900px 700px at 50% 25%,var(--ink2),var(--ink) 75%);
           font-family:'Noto Sans Thai','Sarabun','Tahoma',sans-serif;font-weight:700}
          #grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#38d6ff 1px,transparent 1px),linear-gradient(90deg,#38d6ff 1px,transparent 1px);background-size:60px 60px}
          #flag{position:absolute;left:90px;top:90px;width:900px;height:12px;display:flex;border-radius:6px;overflow:hidden}
          #flag i{display:block}
          #chip{position:absolute;left:0;width:100%;top:150px;text-align:center;font-size:40px;color:var(--acc);letter-spacing:1px}
          .scene{position:absolute;inset:0;opacity:0}
          .art{position:absolute;left:0;top:230px;width:1080px;height:900px}
          .art svg{width:1080px;height:900px;overflow:visible}
          .txt{position:absolute;left:90px;top:1170px;width:900px;height:470px;display:flex;align-items:center;justify-content:center;
           text-align:center;font-size:66px;line-height:1.45;text-shadow:0 4px 24px rgba(0,0,0,.45)}
          .txt span span{display:inline-block;opacity:0;white-space:pre}
          #bar{position:absolute;left:90px;top:1740px;width:900px;height:10px;border-radius:5px;background:rgba(255,255,255,.14)}
          #bar b{display:block;height:100%;width:0;border-radius:5px;background:var(--acc)}
          </style></head>
          <body><div id="stage"><div id="grid"></div>
          <div id="flag"><i style="flex:3;background:#38d6ff"></i><i style="flex:1;background:#ffb020"></i></div>
          <div id="chip">ชิปขาดตลาด · สิ่งที่ถูกลืม</div>
          <div id="scenes"></div>
          <div id="bar"><b></b></div>
          </div>
          <script>
          const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
          const seg=(t,a,b)=>clamp((t-a)/(b-a));
          const E={out:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
           back:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}};
          const $=(root,s)=>root.querySelector(s);
          const ACC='#38d6ff',WARN='#ffb020',RED='#ff4d5e',INK='#070d1f',PAPER='#f2f6ff',NAVY='#12275a';
          const F=`font-family="'Noto Sans Thai',sans-serif" font-weight="700"`;
          function lerp(a,b,t){return a+(b-a)*t}

          /* ---------- Art per scene: {svg, update(root,t)} ---------- */
          const ART=[
           /* 0: AI chip + warning */
           { svg:`<svg viewBox="0 0 1080 900"><defs><radialGradient id="g1"><stop offset="0" stop-color="${ACC}" stop-opacity=".5"/><stop offset="1" stop-color="${ACC}" stop-opacity="0"/></radialGradient></defs>
            <circle class="glow" cx="540" cy="450" r="420" fill="url(#g1)"/>
            <g class="chip">
             ${[380,460,540,620,700].map(p=>`<rect class="pin" x="${p-14}" y="205" width="28" height="48" rx="6" fill="${ACC}"/><rect class="pin" x="${p-14}" y="647" width="28" height="48" rx="6" fill="${ACC}"/><rect class="pin" x="292" y="${p-14}" width="48" height="28" rx="6" fill="${ACC}"/><rect class="pin" x="740" y="${p-14}" width="48" height="28" rx="6" fill="${ACC}"/>`).join('')}
             <rect x="340" y="250" width="400" height="400" rx="40" fill="#0e1c47" stroke="${ACC}" stroke-width="8"/>
             <rect class="core" x="410" y="320" width="260" height="260" rx="24" fill="${ACC}"/>
             <text x="540" y="500" text-anchor="middle" font-size="150" fill="${INK}" ${F}>AI</text>
            </g>
            <g class="warn"><circle cx="800" cy="215" r="78" fill="${WARN}"/><text x="800" y="252" text-anchor="middle" font-size="110" fill="${INK}" ${F}>!</text></g></svg>`,
            update(r,t){
             const s=E.back(seg(t,0,.7));
             $(r,'.chip').setAttribute('transform',`translate(540 450) scale(${s}) translate(-540 -450)`);
             $(r,'.glow').setAttribute('opacity',.7+.3*Math.sin(t*3));
             $(r,'.core').setAttribute('opacity',.85+.15*Math.sin(t*5));
             r.querySelectorAll('.pin').forEach((p,i)=>p.setAttribute('opacity',.55+.45*Math.max(0,Math.sin(t*4-i*.5))));
             const w=E.back(seg(t,1.6,2.2)), sh=Math.sin(t*18)*4*seg(t,2.2,2.6)*(1-seg(t,2.6,3.2));
             $(r,'.warn').setAttribute('transform',`translate(${800+sh} 215) scale(${w}) translate(-800 -215)`);
            }},
           /* 1: data-center racks lighting up */
           { svg:`<svg viewBox="0 0 1080 900">
            ${[150,420,690].map((x,i)=>`<g class="rack" data-i="${i}"><rect x="${x}" y="110" width="240" height="640" rx="24" fill="#0e1c47" stroke="${ACC}" stroke-width="5"/>
             ${[0,1,2,3,4].map(j=>`<rect x="${x+20}" y="${135+j*118}" width="200" height="92" rx="12" fill="${NAVY}"/><rect x="${x+36}" y="${171+j*118}" width="90" height="20" rx="10" fill="#ffffff" fill-opacity=".18"/><circle class="led" data-k="${i*5+j}" cx="${x+190}" cy="${181+j*118}" r="13" fill="${ACC}" opacity="0"/>`).join('')}</g>`).join('')}
            <text x="540" y="850" text-anchor="middle" font-size="50" fill="#fff" ${F}>ศูนย์ข้อมูล AI</text></svg>`,
            update(r,t){
             r.querySelectorAll('.rack').forEach((g,i)=>{
              const p=E.out(seg(t,i*.18,.5+i*.18));
              g.setAttribute('transform',`translate(0 ${(1-p)*60})`); g.setAttribute('opacity',p);
             });
             r.querySelectorAll('.led').forEach(l=>{
              const k=+l.dataset.k, on=seg(t,.5+k*.11,.65+k*.11);
              l.setAttribute('opacity',on*(.7+.3*Math.sin(t*6+k)));
             });
            }},
           /* 2: supply vs demand */
           { svg:`<svg viewBox="0 0 1080 900">
            <rect x="150" y="760" width="780" height="8" rx="4" fill="#fff" fill-opacity=".3"/>
            <rect class="gap" x="300" y="140" width="200" height="320" rx="14" fill="${WARN}" fill-opacity=".18" stroke="${WARN}" stroke-width="4" stroke-dasharray="14 10"/>
            <text class="gaptx" x="400" y="320" text-anchor="middle" font-size="58" fill="${WARN}" ${F}>ขาด</text>
            <rect class="sup" x="300" y="760" width="200" height="0" rx="14" fill="#3b6dff"/>
            <rect class="dem" x="580" y="760" width="200" height="0" rx="14" fill="${RED}"/>
            <text x="400" y="835" text-anchor="middle" font-size="44" fill="#fff" ${F}>กำลังผลิต</text>
            <text x="680" y="835" text-anchor="middle" font-size="44" fill="#fff" ${F}>ความต้องการ</text></svg>`,
            update(r,t){
             const hs=300*E.out(seg(t,.2,.9)), hd=620*E.out(seg(t,.5,1.8));
             const s=$(r,'.sup'), d=$(r,'.dem');
             s.setAttribute('height',hs); s.setAttribute('y',760-hs);
             d.setAttribute('height',hd); d.setAttribute('y',760-hd);
             const g=seg(t,1.8,2.4);
             $(r,'.gap').setAttribute('opacity',g); $(r,'.gaptx').setAttribute('opacity',g*(.7+.3*Math.sin(t*6)));
            }},
           /* 3: price up on devices */
           { svg:`<svg viewBox="0 0 1080 900">
            ${[[210,'ph'],[540,'lp'],[870,'ram']].map(([x,k],i)=>`<g class="card" data-x="${x}"><rect x="${x-130}" y="150" width="260" height="260" rx="44" fill="#ffffff" fill-opacity=".1" stroke="${ACC}" stroke-width="5"/>
             ${k==='ph'?`<rect x="${x-44}" y="195" width="88" height="170" rx="16" fill="none" stroke="#fff" stroke-width="8"/><circle cx="${x}" cy="345" r="7" fill="#fff"/>`:''}
             ${k==='lp'?`<rect x="${x-82}" y="205" width="164" height="110" rx="10" fill="none" stroke="#fff" stroke-width="8"/><rect x="${x-104}" y="326" width="208" height="16" rx="8" fill="#fff"/>`:''}
             ${k==='ram'?`<rect x="${x-92}" y="235" width="184" height="86" rx="8" fill="#2fbf71"/>${[0,1,2,3].map(n=>`<rect x="${x-70+n*38}" y="250" width="26" height="30" rx="4" fill="${INK}"/>`).join('')}${[0,1,2,3,4,5,6,7].map(n=>`<rect x="${x-84+n*22}" y="321" width="12" height="20" fill="${WARN}"/>`).join('')}`:''}</g>
            <g class="arr" data-x="${x}"><path d="M${x} 640 V540 M${x-42} 580 L${x} 535 L${x+42} 580" fill="none" stroke="${RED}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g>
            <text x="${x}" y="720" text-anchor="middle" font-size="48" fill="#fff" ${F}>${['โทรศัพท์','โน้ตบุ๊ก','แรม'][i]}</text>`).join('')}
            <text class="pr" x="540" y="840" text-anchor="middle" font-size="56" fill="${WARN}" ${F}>ราคาอาจสูงขึ้น</text></svg>`,
            update(r,t){
             r.querySelectorAll('.card').forEach((g,i)=>{
              const s=E.back(seg(t,.2+i*.35,.8+i*.35)), x=+g.dataset.x;
              g.setAttribute('transform',`translate(${x} 280) scale(${s}) translate(${-x} -280)`);
             });
             r.querySelectorAll('.arr').forEach((g,i)=>{
              const a=1.0+i*.35, p=E.out(seg(t,a,a+.5)), bob=Math.sin(t*5-i)*6*p;
              g.setAttribute('transform',`translate(0 ${(1-p)*50-bob})`); g.setAttribute('opacity',p);
             });
             $(r,'.pr').setAttribute('opacity',seg(t,2.2,2.7));
            }},
           /* 4: timeline: today -> next year -> ? */
           { svg:`<svg viewBox="0 0 1080 900">
            <rect x="140" y="440" width="800" height="14" rx="7" fill="#fff" fill-opacity=".2"/>
            <rect class="line" x="140" y="440" width="0" height="14" rx="7" fill="${ACC}"/>
            ${[[220,'วันนี้'],[540,'ปีหน้า'],[860,'?']].map(([x,s],i)=>`<g class="node" data-x="${x}" data-i="${i}"><circle cx="${x}" cy="447" r="${i===2?64:52}" fill="${i===2?WARN:ACC}"/>${i===2?`<text x="${x}" y="480" text-anchor="middle" font-size="90" fill="${INK}" ${F}>?</text>`:''}</g>
            <text class="nl" data-i="${i}" x="${x}" y="600" text-anchor="middle" font-size="56" fill="#fff" ${F}>${i===2?'':s}</text>`).join('')}
            <text class="nl" data-i="2" x="860" y="600" text-anchor="middle" font-size="56" fill="${WARN}" ${F}>นานแค่ไหน</text></svg>`,
            update(r,t){
             $(r,'.line').setAttribute('width',720*E.io(seg(t,.2,2.2)));
             r.querySelectorAll('.node').forEach((g,i)=>{
              const a=.1+i*.9, s=E.back(seg(t,a,a+.5)), x=+g.dataset.x, pul=i===2?1+.07*Math.sin(t*6)*seg(t,2.0,2.4):1;
              g.setAttribute('transform',`translate(${x} 447) scale(${s*pul}) translate(${-x} -447)`);
             });
             r.querySelectorAll('.nl').forEach(l=>{const i=+l.dataset.i;l.setAttribute('opacity',seg(t,.3+i*.9,.8+i*.9));});
            }},
           /* 5: comment + follow */
           { svg:`<svg viewBox="0 0 1080 900"><g class="bub"><path d="M250 90 H830 A70 70 0 0 1 900 160 V400 A70 70 0 0 1 830 470 H520 L400 580 L420 470 H250 A70 70 0 0 1 180 400 V160 A70 70 0 0 1 250 90 Z" fill="${PAPER}"/>
            ${[0,1,2].map(i=>`<circle class="dot" data-i="${i}" cx="${420+i*120}" cy="280" r="30" fill="#27407f"/>`).join('')}</g>
            <g class="btn"><rect x="270" y="650" width="540" height="150" rx="75" fill="${RED}"/>
            <text x="540" y="750" text-anchor="middle" font-size="72" fill="#fff" ${F}>ติดตาม</text></g></svg>`,
            update(r,t){
             const b=E.back(seg(t,.1,.7));
             $(r,'.bub').setAttribute('transform',`translate(540 330) scale(${b}) translate(-540 -330)`);
             r.querySelectorAll('.dot').forEach((d,i)=>d.setAttribute('cy',280-22*Math.max(0,Math.sin(t*6-i*.9))));
             const pulse=1+.06*Math.sin(t*5)*seg(t,1.2,1.6), pop=E.back(seg(t,1.0,1.6));
             $(r,'.btn').setAttribute('transform',`translate(540 725) scale(${pop*pulse}) translate(-540 -725)`);
            }}
          ];

          /* ---------- Timeline wiring ---------- */
          let TL=null, nodes=[];
          function split(text){
           const sg=new Intl.Segmenter('th',{granularity:'word'});
           return [...sg.segment(text)].map(s=>s.segment);
          }
          window.setTimeline=function(tl){
           TL=tl; const host=document.getElementById('scenes'); host.innerHTML=''; nodes=[];
           tl.scenes.forEach((s,i)=>{
            const el=document.createElement('div'); el.className='scene';
            const art=document.createElement('div'); art.className='art'; art.innerHTML=ART[i%ART.length].svg;
            const txt=document.createElement('div'); txt.className='txt';
            const inner=document.createElement('div');
            const phrases=s.text.split(/\s+/).filter(Boolean);
            const total=phrases.join('').length; let acc=0; const spans=[];
            phrases.forEach((ph,pi)=>{
             const box=document.createElement('span'); box.style.cssText='display:inline-block;opacity:1;white-space:nowrap;margin:0 .18em';
             split(ph).forEach(w=>{const sp=document.createElement('span'); sp.textContent=w; box.appendChild(sp);
              spans.push({sp,at:(acc/total)*s.speech*.92}); acc+=w.length;});
             inner.appendChild(box);
            });
            txt.appendChild(inner); el.appendChild(art); el.appendChild(txt); host.appendChild(el);
            nodes.push({el,art,spans});
           });
          };
          window.seek=function(T){
           TL.scenes.forEach((s,i)=>{
            const n=nodes[i], t=T-s.start, last=i===TL.scenes.length-1;
            if(t<-.01||t>=s.dur){n.el.style.opacity=0;n.el.style.display='none';return;}
            n.el.style.display='block';
            const fin=E.out(seg(t,0,.35)), fout=last?1:1-seg(t,s.dur-.25,s.dur);
            n.el.style.opacity=fin*fout;
            n.art.style.transform=`translateY(${(1-fin)*30}px)`;
            ART[i%ART.length].update(n.art,t);
            n.spans.forEach(w=>{
             const p=E.out(seg(t,w.at,w.at+.28));
             w.sp.style.opacity=p; w.sp.style.transform=`translateY(${(1-p)*22}px)`;
            });
           });
           document.querySelector('#bar b').style.width=(100*clamp(T/TL.total))+'%';
          };
          </script></body></html>
          EOF_FILE
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          npm install
          npx playwright install --with-deps chromium
      - name: Generate voice (Paxa TTS)
        env:
          PAXA_API_KEY: ${{ secrets.PAXA_API_KEY }}
        run: node scripts/tts.mjs
      - name: Render video
        run: node scripts/render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
